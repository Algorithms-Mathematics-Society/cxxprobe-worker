[project]
name = "cxxprobe-worker"
version = "0.1.0"
description = "Job-execution daemon that runs cxxprobe judge jobs and stores their artifacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
cxxprobe-worker = "cxxprobe_worker.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "A",       # builtins shadowing
    "C4",      # comprehensions
    "SIM",     # simplify
    "PTH",     # use pathlib
    "RET",     # return
    "ARG",     # unused arguments
    "TRY",     # exception antipatterns
    "RUF",
]
ignore = [
    "TRY003",  # long messages outside exception class — we prefer them inline
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
# tests/ has no __init__.py (pytest rootdir-relative discovery), so without
# this mypy names the modules `test_config` rather than `tests.test_config`
# and the override below never matches.
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
# Test functions are `def test_x():` by convention; requiring `-> None` on
# every one is pure noise. Everything they *call* is still fully typed.
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
