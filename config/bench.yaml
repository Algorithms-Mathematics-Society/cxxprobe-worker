# Benchmark pool (cxxprobe #12, worker #12/#13).
#
# One of these runs on each machine of the benchmark pool: one region, one
# availability zone, one instance type, nothing else on the box. A bencher
# runs exactly one benchmark at a time (`concurrency: 1` is enforced for
# `role: bencher`) and only benchmark jobs, from its own queue, so judging
# traffic can never share a machine with a measurement.
#
# The instance type is c7i.xlarge: 4 vCPU = 2 physical cores. The OS, IRQs
# and this worker are confined to core 0 (CPUs 0-1) by bench-user-data.sh;
# cxxprobe pins the measured process to CPU 2 and CPU 3, its hyperthread
# sibling, is left idle. A 2-vCPU type (c7i.large, c7i-flex.large) is one
# core plus its sibling and cannot keep the sibling idle while also running
# the OS, which is why the pool does not use the judging fleet's type.
environment: prod
worker_id: bench-unknown
role: bencher
concurrency: 1
max_jobs: 100000

judge:
  binary: /usr/local/bin/cxxprobe
  timeout_seconds: 900

bench:
  repetitions: 7
  warmups: 1
  attempts: 3
  noise_threshold: 0.05
  cpu: 2
  profile: true
  timeout_seconds: 900
  # Set to the pool's measured calibration median once, after the first
  # pool is up (`cxxprobe bench calibrate --cpu 2`), so every machine is held
  # to the same speed. Unset, each machine catches only its own drift.
  calibration_baseline_ns: null
  calibration_tolerance: 0.05
  calibration_every_seconds: 900
  calibration_every_jobs: 10
  min_team_interval_seconds: 300
  # Rewritten at boot with the instance id and zone; see bench-user-data.sh.
  machine_id: ""

workspace:
  root: /var/lib/cxxprobe-worker/workspaces
  keep_on_failure: false

aws:
  region: ap-south-1

storage:
  backend: s3
  bucket: ams-prod-objects
  prefix: artifacts

queue:
  backend: sqs
  # Benchmarks only. Never the judging queues.
  queue_url: https://sqs.ap-south-1.amazonaws.com/362249012864/benchmark
  wait_time_seconds: 20
  visibility_timeout_seconds: 1800
  max_delivery_attempts: 5

control_plane:
  base_url: https://api.amsaccess.com
  api_key: ""
  pool: bench
  heartbeat_seconds: 10

monitoring:
  log_level: info
  log_format: json
  health_file: /var/run/cxxprobe-worker/health.json
